# Vokabular KODA nije ovdje. Kriterij koji cita tools/wem_lint.py zivi po
# distribuciji, u JSON obliku (`tools/dictionary.json` + prezentacija
# `tools/messages.json`), jer je lint stdlib-only pa YAML ne moze parsirati.
# Blok `code:` bio je od kriterija 0.8.0 zastarjela kopija i uklonjen je
# 2026-08-24 (DR-WFL-020). Povijesne reference na `naming_registry.yaml` i na
# `dictionary.yaml#code` citati kao `tools/dictionary.json`.
#
# PAZNJA — `acronyms` (vrh datoteke) i `identifier_acronyms` u kriteriju koda
# NISU isti vokabular i ne smiju se spojiti:
#   acronyms              kratice DOKTRINE (DQI, NFR, PDSA, SBVR); nose
#                         expansion i reference; citaju ih ljudi
#   identifier_acronyms   tokeni u IDENTIFIKATORIMA (JSON, URI, SQL, OSCAL);
#                         nose samo pravilo pisanja; cita ih lint
# Presjek im je prazan (mjereno 2026-07-28) i mora ostati prazan.
