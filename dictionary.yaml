# Wattleflow rjecnik — strojno citljivi izvor istine.
# Nosi JEDAN kontrolirani vokabular: diskurs (entries + acronyms). Vokabular
# koda zivi u kriteriju po distribuciji (`tools/dictionary.json`), v. biljesku
# na dnu (DR-WFL-020).
# Treci registar kontroliranog vokabulara su reference -> LITERATURE.md.
# RJECNIK.md je GENERIRANI PRIKAZ ovog registra (pravilo pentade: prikaz nije
# izvor istine). CSV/JSON pogledi izvode se po potrebi.
#
# Shema poravnata sa SKOS-om (W3C) radi buduceg RDF eksporta:
#   term_hr -> skos:prefLabel@hr, term_en -> skos:prefLabel@en,
#   aliases -> skos:altLabel, definition -> skos:definition,
#   related -> skos:related, status: zastarjelo -> owl:deprecated,
#   scope_note -> skos:scopeNote (razrjesenje viseznacnosti).
#
# Upravljanje: natuknica se dodaje/mijenja/deprecira iskljucivo kroz DR.

registry: wattleflow-rjecnik
registry_version: "0.3.0"   # 0.2.0: apsorbiran vokabular koda (blok `code:`)
                            # 0.2.1: kategorija OSCAL (DR-WFL-013)
                            # 0.3.0: blok `code:` uklonjen — kriterij koda je
                            #        tools/dictionary.json (DR-WFL-020)
languages: [hr, en]
source_of_truth: true
generated_views:
  - path: documentation/DICTIONARY.md
    note: "ljudski citljiv prikaz; generira se ili verificira prema ovom registru"

governance:
  change_mechanism: DR
  statuses: [usvojen, privremeno, zastarjelo]
  entry_criteria:
    - nosiv za doktrinu
    - viseznacan u literaturi
    - koristen u najmanje dva doktrinarna dokumenta
  precedence: >
    U sukobu znacenja ovaj registar nadglasava kolokvijalnu upotrebu u svim
    doktrinarnim dokumentima; sukob s PHILOSOPHY.md ili METHODOLOGY.md je
    greska koja se razrjesava DR-om.
  feeds_hypothesis: H2
  h2_signal: >
    Broj razrijesenih viseznacnosti naspram broja nerazrijesenih upotreba u
    dokumentima (pretraga po forbidden_usages uzorcima).

related_registries:
  - path: documentation/LITERATURE.md
    domain: reference (kljucevi 1-64, append-only)
  - path: documentation/POSTULATE.md
    domain: tvrdnje (P-01..P-21)
  - path: documentation/DOCTRINE.md
    domain: norme (D-01..D-17)
# naming_registry.yaml je UKINUT 2026-07-28; njegov sadrzaj je od tada kriterij
# koda, a od 2026-08-24 zivi samo u `tools/dictionary.json` (DR-WFL-020).

ontological_statuses: [cin, stanje, znak, artefakt, svojstvo, pravilo, pojava, alat]
layers: [filozofija, policy, princip, metoda, arhitektura, zahtjevi, sve]
categories:
  - ontoloska-kategorija   # Dio I
  - epistemologija-mjerenje # Dio II
  - artefakt-alat          # Dio III
  - akronim                # Dio IV
  - viseznacnost           # Dio V (scope_note obavezan)

entries:

  # ------------------------------------------------------------------ Dio I
  - id: odluka
    term_hr: Odluka
    term_en: decision
    category: ontoloska-kategorija
    ontological_status: cin
    layer: sve
    definition: >
      Evidentiran cin prijelaza: mijenja jedno ili vise stanja (politiku,
      arhitekturu, kriterij); nosi autora, kontekst, razmotrene alternative,
      cijenu i temelje. Nepromjenjiva; kasnija odluka je nadomjesta
      (supersedes), nikad ne prepisuje.
    references: [44, 45]
    related: [zapis-odluke, politika, arhitektura]
    status: usvojen

  - id: zapis-odluke
    term_hr: Zapis odluke
    term_en: decision record
    aliases: [DR]
    category: ontoloska-kategorija
    ontological_status: artefakt
    layer: metoda
    definition: >
      Artefakt koji serijalizira odluku; trenutna pod-metoda evidencije
      (METHODOLOGY 8.1). Nosi polje sloj koje odluku smjesta u kaskadu.
      Naslijedeni naziv ADR zadrzava se samo u povijesnim referencama.
    references: [44, 46]
    related: [odluka, kaskada]
    status: usvojen

  - id: politika
    term_hr: Politika
    term_en: policy
    category: ontoloska-kategorija
    ontological_status: stanje
    layer: policy
    definition: >
      Normativno stanje na snazi: sto mora vrijediti. Deonticka je (moze se
      prekrsiti, pa se provodi); donosi je, mijenja i ukida odluka. Svaka
      politika deklarira provedbeni mehanizam i evaluacijski signal —
      politika bez oba vodi se kao aspiracija. Kvalifikator obavezan
      (razvojna, sigurnosna, politika imenovanja).
    references: [22]
    standards: [OMG SBVR]
    related: [odluka, kriterij-metoda]
    status: usvojen

  - id: arhitektura
    term_hr: Arhitektura
    term_en: architecture
    category: ontoloska-kategorija
    ontological_status: stanje
    layer: arhitektura
    definition: >
      Tehnicko stanje: temeljna svojstva i struktura sustava u njegovu
      okruzenju (granice, odgovornosti, ovisnosti, ugovori). Nije skup
      odluka (one su geneza i opravdanje) i nije dijagram (on je prikaz).
    references: [1, 2]
    standards: [ISO/IEC/IEEE 42010]
    related: [opis-arhitekture, prikaz, odluka]
    status: usvojen

  - id: opis-arhitekture
    term_hr: Opis arhitekture
    term_en: architecture description
    category: ontoloska-kategorija
    ontological_status: artefakt
    layer: metoda
    definition: >
      Artefakt koji arhitekturu dokumentira; sadrzi poglede, gledista i
      obrazlozenja. Razlikovati od arhitekture same (stanja).
    standards: [ISO/IEC/IEEE 42010]
    related: [arhitektura, prikaz]
    status: usvojen

  - id: kriterij-metoda
    term_hr: Kriterij / metoda
    term_en: criterion / method
    category: ontoloska-kategorija
    ontological_status: stanje
    layer: metoda
    definition: >
      Mjerno stanje: cime se provjerava konformnost ili kvaliteta (registar,
      protokol, alat s verzijom). Verzionira se odvojeno od predmeta
      mjerenja; promjena kriterija mijenja nalaz bez promjene predmeta.
    references: [22]
    related: [konformna-mjera, trojka-reproducibilnosti]
    status: usvojen

  - id: prikaz
    term_hr: Prikaz / pogled
    term_en: view
    category: ontoloska-kategorija
    ontological_status: znak
    layer: metoda
    definition: >
      Projekcija nekog stanja za odredenu publiku, po deklariranom gledistu
      (ISO 42010 viewpoint). Generira se iz izvora istine ili se prema njemu
      verificira; nikad nije izvor istine. Zastarijeva — drift prikaza od
      stanja ista je klasa problema kao drift dokumentacije.
    references: [38, 51]
    standards: [ISO/IEC/IEEE 42010]
    related: [arhitektura, opis-arhitekture]
    status: usvojen

  - id: filozofija
    term_hr: Filozofija
    term_en: philosophy (doctrinal apex)
    category: ontoloska-kategorija
    ontological_status: stanje
    layer: filozofija
    definition: >
      Najvisa instanca kaskade: epistemoloski diskurs koji odreduje sto
      vrijedi kao znanje i kako se revidira; kisobran nad politikama,
      principima i metodama.
    related: [doktrina, kaskada]
    status: usvojen

  - id: doktrina
    term_hr: Doktrina
    term_en: doctrine
    category: ontoloska-kategorija
    ontological_status: stanje
    layer: filozofija
    definition: >
      Obvezujuci, dokumentirani dio filozofije i njezinih izvedenica; ono
      cega se ostala dokumentacija mora pridrzavati.
    related: [filozofija, kaskada]
    status: usvojen

  - id: princip
    term_hr: Princip
    term_en: principle
    category: ontoloska-kategorija
    ontological_status: stanje
    layer: princip
    definition: >
      Priznato inzenjersko ili znanstveno nacelo usvojeno kao osnova
      prosudbe (Parnas, SOLID, DRY, Occam...); bira se pod politikama,
      opravdava metode.
    references: [1, 2, 29]
    related: [kaskada, politika]
    status: usvojen

  - id: kaskada
    term_hr: Kaskada (subordinacija slojeva)
    term_en: cascade (layer subordination)
    category: ontoloska-kategorija
    ontological_status: pravilo
    layer: sve
    definition: >
      Pravilo da nizi sloj (metoda) ne nadjacava visi (princip, politika,
      filozofija); prijelaz medu stanjima ide iskljucivo kroz odluku (DR).
    related: [odluka, filozofija]
    status: usvojen

  # ----------------------------------------------------------------- Dio II
  - id: hipoteza
    term_hr: Hipoteza
    term_en: hypothesis
    category: epistemologija-mjerenje
    ontological_status: artefakt
    layer: filozofija
    definition: >
      Opovrgljiv oblik doktrinarne tvrdnje: tvrdnja + mjera + sto bi je
      oborilo. Doktrinarna tvrdnja bez hipoteze deklarira se kao
      konceptualna. Aktivne: H1 (drift), H2 (semanticka entropija), H3
      (valjanost instrumenta), H4-DQI (prediktivnost kvalitete).
    related: [svjedocanstvo, valjanost-mjere]
    status: usvojen

  - id: svjedocanstvo
    term_hr: Svjedocanstvo
    term_en: evidence
    category: epistemologija-mjerenje
    ontological_status: svojstvo
    layer: sve
    definition: >
      Dokazni status tvrdnje ili odluke: empirijski nalaz, mjerenje,
      incident, standard ili eksplicitna deklaracija aspiracije. Odsutnost
      prigovora nije svjedocanstvo.
    related: [temelji, hipoteza]
    status: usvojen

  - id: temelji
    term_hr: Temelji
    term_en: grounding
    category: epistemologija-mjerenje
    ontological_status: svojstvo
    layer: sve
    definition: >
      Opravdavajuci lanac odluke: informacije -> istrazivanje/konzultacije
      -> analiza -> zakljucak -> preporuka. Polje DR zapisa, komplementarno
      Svjedocanstvu (Temelji prethode odluci; Svjedocanstvo je prati i
      slijedi).
    related: [svjedocanstvo, zapis-odluke]
    status: usvojen

  - id: mjera-stanja
    term_hr: Mjera stanja
    term_en: state measure
    category: epistemologija-mjerenje
    ontological_status: svojstvo
    layer: metoda
    definition: >
      Opisuje zatecenu strukturu artefakta; artefakt je dovoljan izvor
      podataka.
    references: [11]
    related: [mjera-odluke]
    status: usvojen

  - id: mjera-odluke
    term_hr: Mjera odluke
    term_en: decision measure
    category: epistemologija-mjerenje
    ontological_status: svojstvo
    layer: metoda
    definition: >
      Procjenjuje isplativost izbora pod neizvjesnoscu; trazi razdiobu nad
      buducim stanjima svijeta.
    references: [6]
    related: [mjera-stanja, volatilnost]
    status: usvojen

  - id: konformna-mjera
    term_hr: Konformna mjera
    term_en: conformance measure
    category: epistemologija-mjerenje
    ontological_status: svojstvo
    layer: metoda
    definition: >
      Mjera relativna na deklarirani kriterij: kaze "uskladeno s ovim
      skupom", ne "dobro po sebi"; promijeni kriterij — promijeni se broj.
      Suprotnost: deskriptivna mjera.
    related: [kriterij-metoda, konformnost-vs-kvaliteta]
    status: usvojen

  - id: valjanost-mjere
    term_hr: Valjanost mjere
    term_en: measure validity
    category: epistemologija-mjerenje
    ontological_status: svojstvo
    layer: metoda
    definition: >
      Status po protokolu V1-V6 (reprezentacijski uvjet, tip skale,
      sadrzajna pokrivenost, prediktivna valjanost, osjetljivost, erozija).
      Mjera bez statusa je tvrdnja na autoritet formule.
    references: [15, 16, 19, 22, 35]
    related: [erozija-mjere, vektorski-nalaz]
    status: usvojen

  - id: erozija-mjere
    term_hr: Erozija mjere (Goodhart/Campbell)
    term_en: measure erosion
    category: epistemologija-mjerenje
    ontological_status: pojava
    layer: metoda
    definition: >
      Pokazatelj koristen za upravljanje prestaje mjeriti ono sto je mjerio;
      zato je zadana uporaba mjere dijagnosticka, a upravljacka (gate)
      eksplicitno ogranicena.
    references: [22]
    related: [valjanost-mjere, politika]
    status: usvojen

  - id: vektorski-nalaz
    term_hr: Vektorski nalaz
    term_en: vector finding
    category: epistemologija-mjerenje
    ontological_status: artefakt
    layer: metoda
    definition: >
      Rezultat po dimenzijama bez skalarne ukupne ocjene; obavezan gdje su
      dimenzije nesumjerljive ili skale nominalne/ordinalne.
    references: [16, 35]
    related: [c-snimka, konformna-mjera]
    status: usvojen

  - id: trojka-reproducibilnosti
    term_hr: Trojka reproducibilnosti
    term_en: reproducibility triple
    category: epistemologija-mjerenje
    ontological_status: pravilo
    layer: metoda
    definition: >
      (verzija alata, verzija kriterija, verzija platforme); nalaz bez
      trojke nije reproducibilan.
    related: [c-snimka, kriterij-metoda]
    status: usvojen

  - id: c-snimka
    term_hr: C-snimka
    term_en: conformance snapshot
    category: epistemologija-mjerenje
    ontological_status: artefakt
    layer: metoda
    definition: >
      Arhivirani zeleni vektor konformnosti s trojkom, datumom i popisom
      deklariranih iznimaka; C0 je prva zelena konformnost jezgre.
    related: [vektorski-nalaz, trojka-reproducibilnosti]
    status: usvojen

  - id: semanticka-entropija
    term_hr: Semanticka entropija
    term_en: semantic entropy
    category: epistemologija-mjerenje
    ontological_status: pojava
    layer: sve
    definition: >
      Viseznacnost znakova sustava (isti znak, vise uloga; ista uloga, vise
      znakova); smanjuje se kontroliranim vokabularom. Nulta tocka: jedan
      TypeVar T s cetiri semantike.
    references: [36, 38]
    related: [rjecnik-registar]
    status: usvojen

  - id: slijepa-pjega
    term_hr: Slijepa pjega
    term_en: blind spot
    category: epistemologija-mjerenje
    ontological_status: svojstvo
    layer: metoda
    definition: >
      Deklarirano nemjereno: ono sto instrument ili proces po konstrukciji
      ne vidi (izuzeti modul, strateski protivnik, latencija signala).
      Deklarira se, nikad ne presucuje.
    references: [32]
    related: [valjanost-mjere]
    status: usvojen

  # ---------------------------------------------------------------- Dio III
  - id: fr-nfr
    term_hr: FR / NFR
    term_en: functional / non-functional requirement
    category: artefakt-alat
    ontological_status: artefakt
    layer: zahtjevi
    definition: >
      Funkcionalni / nefunkcionalni zahtjev (METHODOLOGY 5). NFR je primaran
      (iz ciljeva i nacela; prethodi odlukama kao kriterij) ili izveden
      (generiran odlukom).
    standards: [ISO/IEC/IEEE 29148, ISO/IEC 25010]
    related: [politika, odluka]
    status: usvojen

  - id: registar-imenovanja
    term_hr: Registar imenovanja
    term_en: naming registry
    category: artefakt-alat
    ontological_status: artefakt
    layer: metoda
    definition: >
      Strojno citljivi kontrolirani vokabular koda: domene, opseg, obitelji
      baza, uloge TypeVarova, akronimi identifikatora; TARGET vokabular cija
      odstupanja lint prijavljuje. Od 2026-07-28 zivi kao blok `code:` ovog
      registra; zasebna datoteka naming_registry.yaml je ukinuta.
    related: [wem-lint, rjecnik-registar]
    status: usvojen

  - id: rjecnik-registar
    term_hr: Rjecnik (ovaj registar)
    term_en: doctrine glossary registry
    category: artefakt-alat
    ontological_status: artefakt
    layer: metoda
    definition: >
      Kontrolirani rjecnik diskursa; semioticki stabilizator ljudskog jezika
      doktrine, kao sto je registar imenovanja stabilizator koda. Izvor
      istine je rjecnik.yaml; RJECNIK.md je generirani prikaz.
    references: [38, 51]
    related: [registar-imenovanja, semanticka-entropija]
    status: usvojen

  - id: wem-lint
    term_hr: wem_lint
    term_en: wem_lint
    category: artefakt-alat
    ontological_status: alat
    layer: metoda
    definition: >
      Alat konformnosti u dva izdanja (core: sloj sucelja; workflow:
      registar); vektorski izlaz, verzionirani kriterij, izgraden na
      frameworku koji provjerava (samoreferentnost).
    related: [vektorski-nalaz, c-snimka, registar-imenovanja]
    status: usvojen

  - id: dqi
    term_hr: DQI
    term_en: data quality index
    category: artefakt-alat
    ontological_status: artefakt
    layer: metoda
    definition: >
      Deklarirani zbirni indeks kvalitete podataka nad vektorom dimenzija
      (ISO 25012 / 8000-8); konforman, ne deskriptivan; primaran je vektor.
    standards: [ISO/IEC 25012, ISO 8000-8, ISO 8000-61]
    related: [vektorski-nalaz, valjanost-mjere]
    status: usvojen

  - id: wattleflow-core
    term_hr: Wattleflow Core
    term_en: Wattleflow Core
    category: artefakt-alat
    ontological_status: artefakt
    layer: arhitektura
    definition: >
      Distribucija sucelja dizajn-paterna: cisti ugovori, bez politika,
      stdlib-only.
    related: [wattleflow-workflow]
    status: usvojen

  - id: wattleflow-workflow
    term_hr: Wattleflow Workflow
    term_en: Wattleflow Workflow
    category: artefakt-alat
    ontological_status: artefakt
    layer: arhitektura
    definition: >
      Zero-trust rjesenje za podatkovne tokove gradeno na Coreu; nosi
      konkretne politike (concrete/ sloj).
    related: [wattleflow-core, zero-trust]
    status: usvojen

  - id: wem
    term_hr: WEM
    term_en: Wattleflow Engineering Methodology
    category: artefakt-alat
    ontological_status: artefakt
    layer: metoda
    definition: >
      Wattleflow inzenjerska metodologija (Svezak I = METHODOLOGY.md).
    related: [filozofija]
    status: usvojen

  # ----------------------------------------------------------------- Dio IV
  - id: akronimi
    term_hr: Akronimi (tablica)
    term_en: acronyms
    category: akronim
    ontological_status: artefakt
    layer: sve
    definition: >
      Skupna natuknica; pojedinacni akronimi u polju acronyms nize.
    status: usvojen

  # ------------------------------------------------------------------ Dio V
  - id: viseznacnost-dr
    term_hr: DR (razrijesena viseznacnost)
    term_en: DR (disambiguated)
    category: viseznacnost
    ontological_status: znak
    layer: metoda
    definition: >
      Naslijedeni naziv koji sazima dvije kategorije (arhitektura = stanje;
      odluka = cin) i sugerira da je svaka evidentirana odluka arhitektonska
      — sto vlastiti korpus opovrgava.
    scope_note: >
      Ovdje: DR (zapis odluke) s poljem sloj; "arhitektonska odluka" je DR
      cijeg je sloja arhitektura. Identifikacija "arhitektura jest skup
      odluka" [45] odbacuje se: odluke su geneza i opravdanje arhitekture,
      ne arhitektura sama.
    references: [45]
    forbidden_usages: ["ADR kao naziv novih zapisa"]
    related: [zapis-odluke, arhitektura, odluka]
    status: usvojen

  - id: viseznacnost-arhitektura
    term_hr: Arhitektura vs opis vs dijagram
    term_en: architecture vs description vs diagram
    category: viseznacnost
    ontological_status: znak
    layer: sve
    definition: >
      Tri kategorije: stanje / artefakt / znak (ISO 42010).
    scope_note: >
      Recenica "arhitektura je zastarjela" najcesce znaci "prikaz je
      zastario"; te se tvrdnje ne smiju mijesati.
    related: [arhitektura, opis-arhitekture, prikaz]
    status: usvojen

  - id: viseznacnost-politika
    term_hr: Politika (policy vs politics)
    term_en: policy vs politics
    category: viseznacnost
    ontological_status: znak
    layer: policy
    definition: >
      Ovdje uvijek policy (normativno stanje s provedbom i evaluacijom),
      nikad politics.
    scope_note: Kvalifikator obavezan (razvojna, sigurnosna, imenovanja).
    related: [politika]
    status: usvojen

  - id: viseznacnost-mjera
    term_hr: Mjera vs metrika vs indeks
    term_en: measure vs metric vs index
    category: viseznacnost
    ontological_status: znak
    layer: metoda
    definition: >
      Mjera je homomorfizam iz empirijskog u numericki sustav [15]; metrika
      se koristi samo kolokvijalno (bez tvrdnje o reprezentacijskom uvjetu);
      indeks je deklarirana agregacija (npr. DQI) — konforman, ne mjerni
      rezultat po sebi.
    scope_note: >
      U doktrinarnim tekstovima "metrika" se izbjegava osim u citatima i
      ustaljenim slozenicama (npr. "operativne metrike"); gdje se tvrdi
      mjerenje, koristi se "mjera" uz status valjanosti.
    references: [15]
    related: [valjanost-mjere, dqi]
    status: usvojen

  - id: volatilnost
    term_hr: Volatilnost
    term_en: volatility
    category: viseznacnost
    ontological_status: pojava
    layer: metoda
    definition: >
      Pokriva tri razlicita fenomena; tvrdnje o volatilnosti moraju
      imenovati fenomen.
    scope_note: >
      (1) stohasticka (zahtjevi, egzogena); (2) strukturna (tehnologija,
      koncentracija dobavljaca); (3) strateska (protivnik koji bira potez
      nakon arhitektonske odluke [32]).
    references: [6, 32]
    related: [mjera-odluke, slijepa-pjega]
    status: usvojen

  - id: viseznacnost-iteracija
    term_hr: Iteracija
    term_en: iteration
